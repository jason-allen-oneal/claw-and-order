name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: claw
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: claw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U claw -d claw_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://claw:ci-only-disposable@localhost:5432/claw_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Test emitted JavaScript
        run: node --test dist/test/*.test.js
      - name: Exercise synthetic demo
        run: node --experimental-strip-types src/demo.ts > demo-report.json
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: scaffold-validation
          path: |
            package-lock.json
            demo-report.json
          retention-days: 7
