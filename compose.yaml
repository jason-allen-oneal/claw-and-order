services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: claw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: claw
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claw -d claw"]
      interval: 5s
      timeout: 5s
      retries: 10
  bot:
    profiles: [bot]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://claw:${POSTGRES_PASSWORD:-local-development-only}@db:5432/claw
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
    mem_limit: 512m
volumes:
  postgres-data:
